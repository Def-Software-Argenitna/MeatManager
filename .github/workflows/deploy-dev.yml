name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      REGISTRY: ghcr.io
      GHCR_NAMESPACE: ghcr.io/def-software-argenitna
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate web maps key
        run: |
          if [ -z "${{ secrets.WEB_GOOGLE_MAPS_API_KEY }}" ]; then
            echo "WEB_GOOGLE_MAPS_API_KEY is empty or missing"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./MeatManager-web
          file: ./MeatManager-web/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_NAMESPACE }}/meatmanager-web:dev
            ${{ env.GHCR_NAMESPACE }}/meatmanager-web:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          secrets: |
            web_google_maps_api_key=${{ secrets.WEB_GOOGLE_MAPS_API_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: ./MeatManager-API
          file: ./MeatManager-API/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_NAMESPACE }}/meatmanager-api:dev
            ${{ env.GHCR_NAMESPACE }}/meatmanager-api:sha-${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.5

      - name: Configure kubeconfig
        run: |
          if [ -n "${{ secrets.KUBECONFIG_HOMELAB }}" ]; then
            mkdir -p $HOME/.kube
            echo "${{ secrets.KUBECONFIG_HOMELAB }}" > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
          else
            echo "No KUBECONFIG_HOMELAB secret found, assuming local kubeconfig works"
          fi

      - name: Deploy to K8s (dev)
        env:
          K8S_NAMESPACE: meatmanager
          GHCR_NAMESPACE: ${{ env.GHCR_NAMESPACE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          API_DEV_ENV: ${{ secrets.API_DEV_ENV }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GHCR_USERNAME}" ]; then
            echo "GHCR_USERNAME is empty or missing"
            exit 1
          fi
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "GHCR_TOKEN is empty or missing"
            exit 1
          fi
          if [ -z "${API_DEV_ENV}" ]; then
            echo "API_DEV_ENV is empty or missing"
            exit 1
          fi
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is empty or missing"
            exit 1
          fi

          # ── Namespace ──
          kubectl create ns "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          # ── Image pull secret for GHCR ──
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_TOKEN}" \
            -n "${K8S_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # ── ConfigMap from API_DEV_ENV ──
          printf "%s" "${API_DEV_ENV}" > /tmp/api-dev.env
          # Override DB port to 3307 for dev
          sed -i 's/^DB_PORT=.*/DB_PORT=3307/' /tmp/api-dev.env
          sed -i 's/^CLIENTS_DB_PORT=.*/CLIENTS_DB_PORT=3307/' /tmp/api-dev.env
          kubectl create configmap meatmanager-config \
            --from-env-file=/tmp/api-dev.env \
            -n "${K8S_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/api-dev.env

          # ── Firebase service account Secret ──
          printf "%s" "${FIREBASE_SERVICE_ACCOUNT_JSON}" > /tmp/firebase.json
          kubectl create secret generic meatmanager-api-secret \
            --from-file=firebase-service-account.json=/tmp/firebase.json \
            -n "${K8S_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/firebase.json

          # ── Apply manifests ──
          kubectl apply -f k8s/ -n "${K8S_NAMESPACE}"

          # ── Set image tags ──
          IMAGE_TAG="sha-${{ github.sha }}"
          kubectl set image deployment/meatmanager-api \
            api="${GHCR_NAMESPACE}/meatmanager-api:${IMAGE_TAG}" \
            -n "${K8S_NAMESPACE}"
          kubectl set image deployment/meatmanager-web \
            web="${GHCR_NAMESPACE}/meatmanager-web:${IMAGE_TAG}" \
            -n "${K8S_NAMESPACE}"

          # ── Restart to pick up new images ──
          kubectl rollout restart deployment/meatmanager-api -n "${K8S_NAMESPACE}"
          kubectl rollout restart deployment/meatmanager-web -n "${K8S_NAMESPACE}"

      - name: Wait for dev rollout
        run: |
          kubectl rollout status deployment/meatmanager-api -n meatmanager --timeout=180s
          kubectl rollout status deployment/meatmanager-web -n meatmanager --timeout=120s

      - name: Post-deploy diagnostics
        if: always()
        run: |
          set +e
          echo "=== pods ==="
          kubectl get pods -n meatmanager
          echo "=== api image ==="
          kubectl get deployment/meatmanager-api -n meatmanager -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "=== web image ==="
          kubectl get deployment/meatmanager-web -n meatmanager -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "=== api logs (last 80) ==="
          kubectl logs deployment/meatmanager-api -n meatmanager --tail=80 2>&1 || true
          echo "=== events (last 20) ==="
          kubectl get events -n meatmanager --sort-by='.lastTimestamp' | tail -20

  deploy-to-cluster:
    name: Deploy to K3s cluster (homelab)
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.5

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_HOMELAB }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl get pods -n meatmanager-demo

      - name: Update API image
        run: |
          kubectl set image deployment/api \
            api=ghcr.io/def-software-argenitna/meatmanager-api:sha-${{ github.sha }} \
            -n meatmanager-demo

      - name: Update Web image
        run: |
          kubectl set image deployment/web \
            web=ghcr.io/def-software-argenitna/meatmanager-web:sha-${{ github.sha }} \
            -n meatmanager-demo

      - name: Wait for API rollout
        run: kubectl rollout status deployment/api -n meatmanager-demo --timeout=180s

      - name: Wait for Web rollout
        run: kubectl rollout status deployment/web -n meatmanager-demo --timeout=120s

      - name: Show deployed images
        run: |
          echo "API:"
          kubectl get deployment/api -n meatmanager-demo -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "Web:"
          kubectl get deployment/web -n meatmanager-demo -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Show cluster pod status
        run: kubectl get pods -n meatmanager-demo

      - name: Debug rollout failure
        if: failure()
        run: |
          echo "=== events ==="
          kubectl get events -n meatmanager-demo --sort-by='.lastTimestamp' | tail -20
          echo "=== pods ==="
          kubectl get pods -n meatmanager-demo
          echo "=== api logs (last 100) ==="
          kubectl logs deployment/api -n meatmanager-demo --tail=100 || true
          echo "=== web logs (last 100) ==="
          kubectl logs deployment/web -n meatmanager-demo --tail=100 || true
