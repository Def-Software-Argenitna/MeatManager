name: Deploy Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      REGISTRY: ghcr.io
      GHCR_NAMESPACE: ghcr.io/def-software-argenitna
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate web maps key
        run: |
          if [ -z "${{ secrets.WEB_GOOGLE_MAPS_API_KEY }}" ]; then
            echo "WEB_GOOGLE_MAPS_API_KEY is empty or missing"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./MeatManager-web
          file: ./MeatManager-web/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_NAMESPACE }}/meatmanager-web:dev
            ${{ env.GHCR_NAMESPACE }}/meatmanager-web:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          secrets: |
            web_google_maps_api_key=${{ secrets.WEB_GOOGLE_MAPS_API_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: ./MeatManager-API
          file: ./MeatManager-API/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_NAMESPACE }}/meatmanager-api:dev
            ${{ env.GHCR_NAMESPACE }}/meatmanager-api:sha-${{ github.sha }}

      - name: Deploy dev stack on self-hosted runner
        env:
          GHCR_NAMESPACE: ${{ env.GHCR_NAMESPACE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MAIN_DOMAIN: meatmanager.def-software.com
          DEMO_DOMAIN: meatmanager.demo.def-software.com
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          API_MAIN_ENV: ${{ secrets.API_MAIN_ENV }}
          API_DEV_ENV: ${{ secrets.API_DEV_ENV }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          if [ -z "${GHCR_USERNAME}" ]; then
            echo "GHCR_USERNAME is empty or missing"
            exit 1
          fi
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "GHCR_TOKEN is empty or missing"
            exit 1
          fi
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH is empty or missing"
            exit 1
          fi
          if [ -z "${API_MAIN_ENV}" ]; then
            echo "API_MAIN_ENV is empty or missing"
            exit 1
          fi
          if [ -z "${API_DEV_ENV}" ]; then
            echo "API_DEV_ENV is empty or missing"
            exit 1
          fi
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is empty or missing"
            exit 1
          fi
          mkdir -p "${DEPLOY_PATH}/env" "${DEPLOY_PATH}/secrets" "${DEPLOY_PATH}/nginx"
          cp deploy/docker-compose.cloud.yml "${DEPLOY_PATH}/docker-compose.cloud.yml"
          cp deploy/nginx/meatmanager.def-software.com.conf "${DEPLOY_PATH}/nginx/meatmanager.def-software.com.conf"
          cp deploy/nginx/meatmanager.demo.def-software.com.conf "${DEPLOY_PATH}/nginx/meatmanager.demo.def-software.com.conf"
          printf "GHCR_NAMESPACE=%s\nMAIN_DOMAIN=%s\nDEMO_DOMAIN=%s\nWEB_MAIN_TAG=%s\nAPI_MAIN_TAG=%s\nWEB_DEV_TAG=%s\nAPI_DEV_TAG=%s\n" \
            "${GHCR_NAMESPACE}" \
            "${MAIN_DOMAIN}" \
            "${DEMO_DOMAIN}" \
            "main" \
            "main" \
            "sha-${{ github.sha }}" \
            "sha-${{ github.sha }}" > "${DEPLOY_PATH}/.env"
          printf "%s" "${API_MAIN_ENV}" > "${DEPLOY_PATH}/env/api-main.env"
          printf "%s" "${API_DEV_ENV}" > "${DEPLOY_PATH}/env/api-dev.env"
          sed -i 's/^DB_PORT=.*/DB_PORT=3307/' "${DEPLOY_PATH}/env/api-dev.env"
          sed -i 's/^CLIENTS_DB_PORT=.*/CLIENTS_DB_PORT=3307/' "${DEPLOY_PATH}/env/api-dev.env"
          if [ -n "${FIREBASE_WEB_API_KEY}" ]; then
            printf "\nFIREBASE_WEB_API_KEY=%s\n" "${FIREBASE_WEB_API_KEY}" >> "${DEPLOY_PATH}/env/api-dev.env"
            printf "\nFIREBASE_WEB_API_KEY=%s\n" "${FIREBASE_WEB_API_KEY}" >> "${DEPLOY_PATH}/env/api-main.env"
          fi
          printf "%s" "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${DEPLOY_PATH}/secrets/firebase-service-account.json"
          chmod 600 "${DEPLOY_PATH}/secrets/firebase-service-account.json"
          cd "${DEPLOY_PATH}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker compose -f docker-compose.cloud.yml --env-file .env pull web-dev api-dev
          docker compose -f docker-compose.cloud.yml --env-file .env up -d --force-recreate --wait web-dev api-dev

      - name: Refresh nginx-proxy-manager upstream DNS
        run: |
          # Despues de --force-recreate los containers tienen IPs nuevas. nginx
          # dentro de NPM cachea la resolucion DNS de proxy_pass de forma
          # indefinida y queda sirviendo 502s al IP viejo. Reload graceful
          # (~50ms, sin downtime) re-resuelve los upstream sin afectar a
          # BarManager/KioskManager/admin/portainer que tambien estan detras.
          docker exec nginx-proxy-manager nginx -s reload

      - name: Dump boot diagnostics ([BOOT] lines)
        if: always()
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "=== Boot diagnostics: [BOOT] lines from api-dev ==="
          docker logs --tail 400 meatmanager-api-dev 2>&1 | grep -E "\[BOOT\]|Fatima|DIAG|seedFatima|inter-sucursal" || echo "(no boot lines found yet)"

      - name: Debug deploy failure (containers + logs)
        if: failure()
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "=== Deploy debug: DEPLOY_PATH=${DEPLOY_PATH} ==="
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH missing in debug step too"
            exit 0
          fi
          echo "=== Deploy debug: DEPLOY_PATH tree ==="
          ls -la "${DEPLOY_PATH}" || true
          echo "=== Deploy debug: docker compose ps ==="
          cd "${DEPLOY_PATH}"
          docker compose -f docker-compose.cloud.yml --env-file .env ps || true
          echo "=== Deploy debug: web-dev logs (last 200) ==="
          docker compose -f docker-compose.cloud.yml --env-file .env logs --tail=200 web-dev || true
          echo "=== Deploy debug: api-dev logs (last 200) ==="
          docker compose -f docker-compose.cloud.yml --env-file .env logs --tail=200 api-dev || true
          echo "=== Deploy debug: docker ps ==="
          docker ps -a || true
