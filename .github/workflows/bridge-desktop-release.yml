name: Bridge Desktop Release

on:
  push:
    tags:
      - "bridge-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    # Fijado a windows-2022 a proposito: desde jun-2026 `windows-latest` redirige
    # a windows-2025/VS2026 y node-gyp no detecta Visual Studio, rompiendo la
    # recompilacion nativa de @serialport/bindings-cpp. windows-2022 trae VS2022
    # que node-gyp si encuentra.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: MeatManager-Bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MeatManager-Bridge/package-lock.json

      - name: Setup Python 3.11
        # node-gyp aun importa distutils, removido en Python 3.12; fijamos 3.11
        # para que @serialport/bindings-cpp pueda recompilar contra Electron.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build installer and publish artifacts
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
