  <ellipse cx="58" cy="42" rx="4.5" ry="3.5" fill="white"/>
  <ellipse cx="64" cy="42" rx="4.5" ry="3.5" fill="white"/>
  <ellipse cx="70" cy="44" rx="4.5" ry="3.5" fill="white"/>

  <!-- Texto -->
