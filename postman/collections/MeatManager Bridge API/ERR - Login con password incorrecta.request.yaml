$kind: http-request
name: 'ERR - Login con password incorrecta (debe dar 401)'
method: POST
url: '{{baseUrl}}/bridge/auth/login'
order: 13000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "este-password-no-existe-asdasd"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 401', () => pm.response.to.have.status(401));
