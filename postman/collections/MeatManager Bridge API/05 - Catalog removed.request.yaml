$kind: http-request
name: '05 - Catalog removed (GET /api/bridge/catalog/removed)'
method: GET
url: '{{baseUrl}}/bridge/catalog/removed?scaleId={{scaleId}}'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{deviceToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test('response is array or object', () => pm.expect(data).to.exist);
