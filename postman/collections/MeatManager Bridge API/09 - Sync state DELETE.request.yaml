$kind: http-request
name: '09 - Sync state DELETE (DELETE /api/bridge/sync-state/product-map)'
method: DELETE
url: '{{baseUrl}}/bridge/sync-state/product-map'
order: 10000
headers:
  - key: Authorization
    value: 'Bearer {{deviceToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "scaleId": "{{scaleId}}",
      "productIds": [9999]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200 or 204', () => pm.expect([200, 204]).to.include(pm.response.code));
