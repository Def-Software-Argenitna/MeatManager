# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name meatmanager.demo.def-software.com;
    
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meatmanager.demo.def-software.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/meatmanager.demo.def-software.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meatmanager.demo.def-software.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # API endpoint
    location /api/ {
        proxy_pass http://127.0.0.1:4201/;
    }

    # Web frontend
    location / {
        proxy_pass http://127.0.0.1:4200;
    }
}
